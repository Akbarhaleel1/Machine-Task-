version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: synxcalz-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: synxcalz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes

  mongo-express:
    image: mongo-express
    container_name: synxcalz-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb_data:
  redis_data:
